{{- if .Values.ingress.enabled }}
# /api -> gateway, everything else -> frontend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-market
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: {{ .Values.backend.gateway.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
{{- end }}
