# nginx on the VPS host: sends the domain to the frontend container.
# certbot edits this file to add HTTPS and the HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name atlasmarket.duckdns.org;

    location / {
        # Frontend container, published on localhost only
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
