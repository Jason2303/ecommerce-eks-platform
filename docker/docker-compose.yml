name: atlas-market

services:
  # Static shop UI (nginx). Only service with a port on machine.
  frontend:
    image: ${DOCKERHUB_USERNAME}/shop-frontend:${TAG}
    environment:
      GATEWAY_URL: http://gateway:${GATEWAY_PORT}
    ports:
      - "${FRONTEND_PORT}:8080"
    networks:
      - frontend-network
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  # API gateway: routes /api to product and order, rate limits with Redis
  gateway:
    image: ${DOCKERHUB_USERNAME}/shop-gateway:${TAG}
    environment:
      PORT: ${GATEWAY_PORT}
      PRODUCT_SERVICE_URL: http://product-service:${PRODUCT_PORT}
      ORDER_SERVICE_URL: http://order-service:${ORDER_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN}
    networks:
      - frontend-network
      - app-network
      - redis-network
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${GATEWAY_PORT}/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped

  # Catalogue and stock. Reads cached in Redis.
  product-service:
    image: ${DOCKERHUB_USERNAME}/shop-product-service:${TAG}
    environment:
      PORT: ${PRODUCT_PORT}
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}
    networks:
      - app-network
      - postgres-network
      - redis-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PRODUCT_PORT}/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped

  # Orders. Reserves stock through product-service.
  order-service:
    image: ${DOCKERHUB_USERNAME}/shop-order-service:${TAG}
    environment:
      PORT: ${ORDER_PORT}
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PRODUCT_SERVICE_URL: http://product-service:${PRODUCT_PORT}
    networks:
      - app-network
      - postgres-network
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${ORDER_PORT}/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped

  # Database. Data kept in the postgres_data volume.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped

  # Cache + rate-limit counters..
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - redis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

# internal: true means no internet access, only the services listed can reach it
networks:
  frontend-network:            # frontend <-> gateway
  app-network:                 # gateway <-> product <-> order
    internal: true
  postgres-network:            # product, order <-> postgres
    internal: true
  redis-network:               # gateway, product <-> redis
    internal: true

volumes:
  postgres_data: